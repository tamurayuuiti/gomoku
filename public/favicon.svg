<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#F2D8A9"/>
      <stop offset="100%" stop-color="#E0BB80"/>
    </linearGradient>
    <radialGradient id="bStone" cx="35%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#82827F"/>
      <stop offset="45%" stop-color="#3B3B3A"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <radialGradient id="wStone" cx="35%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F3F1EA"/>
      <stop offset="100%" stop-color="#D6D1C2"/>
    </radialGradient>
    <!-- 影を少し抑えて、拡大した盤が枠内に収まるよう調整 -->
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#8A6D3F" flood-opacity="0.3"/>
    </filter>
    <filter id="stoneShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.7" flood-color="#5A452A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 背景なし(透過) -->

  <!-- 盤面:8〜92 に拡大(角丸+影) -->
  <rect x="8" y="8" width="84" height="84" rx="16" fill="url(#wood)" filter="url(#boardShadow)"/>
  <rect x="8" y="8" width="84" height="84" rx="16" fill="none" stroke="#C89B5F" stroke-width="0.5"/>

  <!-- 5x5 の交点グリッド(拡大に合わせ間隔15) -->
  <path fill="none" stroke="#8A6742" stroke-width="1" opacity="0.45"
    d="M20 20V80M35 20V80M50 20V80M65 20V80M80 20V80M20 20H80M20 35H80M20 50H80M20 65H80M20 80H80"/>

  <!-- 黒石:斜めの三連(石も r7 に拡大) -->
  <g filter="url(#stoneShadow)">
    <circle cx="35" cy="35" r="7" fill="url(#bStone)"/>
    <circle cx="50" cy="50" r="7" fill="url(#bStone)"/>
    <circle cx="65" cy="65" r="7" fill="url(#bStone)"/>
  </g>

  <!-- 白石:対抗形 -->
  <g filter="url(#stoneShadow)">
    <circle cx="65" cy="35" r="7" fill="url(#wStone)" stroke="#C9C3B2" stroke-width="0.5"/>
    <circle cx="35" cy="65" r="7" fill="url(#wStone)" stroke="#C9C3B2" stroke-width="0.5"/>
  </g>
</svg>